name: test

on:
  push:
  pull_request:

jobs:
  repository-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r step8_deployment/requirements-step8.txt
      - name: Run tests
        run: python -m pytest -q tests step9_genai/tests

